[package]
name = "sexton"
version = "0.3.0"
edition = "2021"
description = "The Sexton — persistent TeamSpeak channel chat logger (#3099), now also the audio bridge (#3342)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "sexton"
path = "src/main.rs"

[[bin]]
name = "send-test"
path = "src/bin/send-test.rs"

[[bin]]
name = "probe-channels"
path = "src/bin/probe-channels.rs"

[[bin]]
name = "bridge-test"
path = "src/bin/bridge-test.rs"

[dependencies]
# tsclientlib pinned by exact commit — same rev already proven against this
# server by #3073 (voicespike) and vendored in plnt-android/core.
#
# #3342: `features = ["audio"]` turns on `StreamItem::Audio` and
# `tsclientlib::audio::AudioHandler` (and pulls in `audiopus`) — the bit that
# used to live only in ts-bridge's Cargo.toml. `default-tls` stays off
# (unchanged from #3099): the Sexton's avatar upload already runs over
# the in-cluster Docker network with plain reqwest, and turning it on would
# add a native-TLS build dependency for no behavioural gain.
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio"] }
# Needed directly (not just via tsclientlib) for the `AudioData`/`CodecType`/
# `OutAudio` types the outbound Opus tick builds by hand — same pin, so this
# is the exact crate version tsclientlib itself compiles against.
# `time` 0.3 is the crate tsclientlib's generated message structs use for
# duration fields (e.g. `OutBanClientPart::time`); needed to build a ban length.
time = "0.3"
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }

# #3342: bridge-proto's BridgeEvent/BridgeCommand/Snapshot vocabulary is
# reused in-process now — see the workspace Cargo.toml for why the crate
# still exists post-consolidation.
bridge-proto = { path = "../bridge-proto" }

# Opus encode for the outbound mixed frame — same version ts-bridge proved
# out against this TS6 server; do not bump independently of that history.
audiopus = "0.3.0-rc.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
