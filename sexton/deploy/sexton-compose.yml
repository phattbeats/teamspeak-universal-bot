# PHA-3173: run on the TS6 container's own Docker network and connect by
# container name (`teamspeak6-server:9987`), not `network_mode: host` /
# `teamspeak.phatt.vip` — PHATT-RAID and the TS6 server share one public IP,
# so routing out and back in over the public hostname hairpins and gets
# flood-scored as if from the public internet (PHA-3099 finding #5). Running
# it that way returned `ConnectFailedBanned` on every retry; by container name
# it connects first try.
#
# To run the bot somewhere that is NOT on this Docker network, add
# `--public-fallback` to the command; it ignores `-a` and dials
# teamspeak.phatt.vip instead.
#
# PHA-3342: "everything running off of one docker container / one bot
# account" (Brandon) — the `plnt-ts-bridge` container is gone. Its mixer,
# Opus codec, and public WebSocket server (`:9099`, `PROTOCOL.md`) now run
# inside this container, on the same shared `tsclientlib::Connection` the
# text lane already owned. `ts-bridge/docker-compose.snippet.yml` (the file
# that used to define that second service) is deleted — nothing else in
# this repo defined a `ts-bridge` service, so there is nothing further to
# remove.
#
# Deploy from a checkout of this repo:
#   docker compose -f sexton/deploy/sexton-compose.yml up -d --build
services:
  sexton:
    image: phattbeats/sexton:latest
    # PHA-3342: build context moved from the crate root (`sexton/`) to the
    # repo root — the Sexton now has a workspace path dependency on
    # `bridge-proto` (`../bridge-proto`), which has to be inside the build
    # context for Docker to see it. See `sexton/Dockerfile`'s header comment.
    build:
      context: ../..
      dockerfile: sexton/Dockerfile
    container_name: sexton
    restart: unless-stopped
    networks:
      - phattvip
    environment:
      - RUST_LOG=info
    # PHA-3342: the audio bridge's public WebSocket (formerly ts-bridge's
    # `:9099`) — `expose`, not `ports`, so it reaches other containers on
    # `phattvip` (the realtime voice runtime) without leaving the host.
    expose:
      - "9099"
    volumes:
      - /mnt/user/scratch/sexton/sexton-id.txt:/run/secrets/sexton-identity:ro
      - /mnt/user/appdata/sexton/logs:/var/sexton-logs
    # The image's ENTRYPOINT is the bot itself; override it so the identity can
    # be read out of the mounted secret at start.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      exec /usr/local/bin/sexton -a teamspeak6-server -p 9987
            -n Sexton
            -c "General Shit"
            -i "$$(cat /run/secrets/sexton-identity)"
            -A /usr/local/share/sexton-avatar/brandon.png
            -l /var/sexton-logs
            --ws-bind 0.0.0.0:9099
            --duck-gain 0.25
    # The runtime image is debian-slim: it has no `pgrep` (and no procps), so
    # the old `pgrep -f` check exited 127 every time and the container sat
    # permanently unhealthy (PHA-3217). Read PID 1's argv instead — `-a` because
    # /proc/1/cmdline is NUL-separated and grep otherwise calls it binary.
    healthcheck:
      test: ["CMD", "grep", "-qa", "/usr/local/bin/sexton", "/proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  phattvip:
    external: true
