# PHA-3173: run on the TS6 container's own Docker network and connect by
# container name (`teamspeak6-server:9987`), not `network_mode: host` /
# `teamspeak.phatt.vip` — PHATT-RAID and the TS6 server share one public IP,
# so routing out and back in over the public hostname hairpins and gets
# flood-scored as if from the public internet (PHA-3099 finding #5).
services:
  sexton:
    image: phattbeats/sexton:latest
    build: /mnt/user/appdata/sexton/build-context-v2
    container_name: sexton
    restart: unless-stopped
    networks:
      - phattvip
    environment:
      - RUST_LOG=info
    volumes:
      - /mnt/user/scratch/sexton/sexton-id.txt:/run/secrets/sexton-identity:ro
      - /mnt/user/scratch/sexton/secrets/paperclip-bearer:/run/secrets/paperclip-bearer:ro
      - /mnt/user/appdata/sexton:/var/sexton-logs
    command: >
      sh -c 'exec sexton -a teamspeak6-server -p 9987
            -n Sexton
            -c "General Shit"
            -i "$$(cat /run/secrets/sexton-identity)"
            -A /usr/local/share/sexton-avatar/brandon.png
            -l /var/sexton-logs
            --on-connected /usr/local/bin/on-connected'
    healthcheck:
      test: ["CMD", "pgrep", "-f", "/usr/local/bin/sexton"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  phattvip:
    external: true
