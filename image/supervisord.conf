; PHA-3428: PID 1 for the one-container Sexton.
;
; The point of a supervisor here is the failure mode the issue names: one
; process dying must not drop the whole container. Before this, whisper was a
; separate container precisely so that its OOM (a long track, a 4-thread base.en
; inference, and Unraid's memory pressure all at once) could not take the bot
; out of the channel. Folding it in without a supervisor would have traded that
; isolation away for nothing.
;
; So: every program is autorestart=true with a backoff, and none of them is
; allowed to make supervisord exit. The container as a whole is only unhealthy
; when the healthcheck says a lane is actually down — see image/healthcheck.sh.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
; INFO, not DEBUG: this stream is what `docker logs sexton` shows, and the
; Sexton's own tracing output has to stay readable in it.
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --------------------------------------------------------------------------
; The bot and the audio bridge. One binary since PHA-3342.
;
; priority=10: first up, last down. It owns the only tsclientlib connection and
; the bot account; whisper and the POT provider are both useless without it and
; neither is a startup dependency of it.
; --------------------------------------------------------------------------
[program:sexton]
command=/usr/local/bin/run-sexton
autostart=true
autorestart=true
startsecs=10
startretries=1000000
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=15

; --------------------------------------------------------------------------
; The ears (PHA-3228). Model load takes tens of seconds on base.en, hence the
; generous startsecs — without it supervisord calls a healthy boot a failure
; and restarts into a loop that never finishes loading.
; --------------------------------------------------------------------------
[program:whisper]
command=/usr/local/bin/run-whisper
autostart=true
autorestart=true
startsecs=45
startretries=1000000
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=15

; --------------------------------------------------------------------------
; The music lane's POT provider (PHA-3176). Optional by construction: the
; wrapper exits 0 and stays down if the image was built without it, which is
; why autorestart is `unexpected` rather than `true` — a clean exit here means
; "not installed", and restarting that forever would just spam the log.
; --------------------------------------------------------------------------
[program:pot]
command=/usr/local/bin/run-pot
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=1000000
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10

; --------------------------------------------------------------------------
; The Sexton's own OpenClaw gateway, with the teamspeak channel plugin
; (PHA-3428 option (a), Brandon 2026-09-12: "this container runs its own
; OpenClaw gateway instance ... Do not wire the bridge socket out to the main
; gateway.")
;
; priority=40: last up. It dials the bridge WebSocket on loopback, so starting
; before `sexton` is listening only makes it reconnect. The plugin retries, but
; there is no reason to make it.
;
; startsecs=30: the gateway runs a plugin link-install and loads the stock
; plugin set before it is meaningfully up. A shorter window calls a normal boot
; a failure and restarts into a loop.
;
; autorestart=unexpected + exitcodes=0: run-gateway exits 0 and stays down when
; SEXTON_GATEWAY_ENABLED=0, which is the documented rollback-to-(b) switch —
; same "clean exit means deliberately absent" contract as the POT provider.
; Any other exit is a crash and is restarted.
;
; stopwaitsecs=25: it has channels to close and session state to flush. Better
; that than letting Docker's 10s default escalate to KILL mid-write on the
; mounted state dir.
; --------------------------------------------------------------------------
[program:gateway]
command=/usr/local/bin/run-gateway
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=1000000
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=25
