; PHA-3791: PID 1 for the one container that runs every TeamSpeak bot.
;
; Shared services are fixed programs here. The bots are generated per persona
; pack by /opt/universal/stack.mjs into /run/universal/bots.conf: one
; `core-<id>` (the Rust core: TeamSpeak identity + bridge socket) per bot, and
; `menace-<id>` where a bot has menace on. ts-summoner starts and stops the
; cores for shifts; everything else runs all the time.
;
; Every program restarts on its own with a backoff and none can make
; supervisord exit: one crash must not take the room down (PHA-3428).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; The ears: N whisper.cpp workers + the coalescing proxy every bot dials on
; :8082 (PHA-3598/3607/3921). Model load takes a while, hence startsecs.
[program:whisper]
command=/usr/local/bin/run-whisper-pool
autostart=true
autorestart=true
startsecs=20
startretries=1000000
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15

; The music lane's POT provider (PHA-3176). Exits 0 when not built in.
[program:pot]
command=/usr/local/bin/run-pot
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=1000000
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10

; Bexton's band generator (PHA-3554 suno-api). Idles without /config/suno-api.env.
[program:suno-api]
command=/usr/local/bin/run-suno-api
autostart=true
autorestart=true
startsecs=10
startretries=1000000
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15

; The one OpenClaw gateway: every bot is an account + agent in it.
; startsecs/stopwaitsecs: see PHA-3428's notes; it flushes session state.
[program:gateway]
command=/usr/local/bin/run-gateway
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=1000000
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=25

; Shifts, summons, scenes, guests (PHA-3821 and on). Last up: it starts and
; stops the cores, so it waits for them to exist. Idles under SUMMONER_ENABLED=0.
[program:summoner]
command=/usr/local/bin/run-summoner
autostart=true
autorestart=true
startsecs=5
startretries=1000000
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=10

[include]
files=/run/universal/bots.conf
