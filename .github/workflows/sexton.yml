name: sexton

# #3173 verification pipeline, extended by #3580 to cover the
# teamspeak-plugin/ tree that used to be the separate openclaw-teamspeak-plugin
# repo's own workflow. The dev sandbox that writes this code has no C
# toolchain (no cc/gcc), so it cannot compile tsclientlib locally — the
# `build`/`docker` jobs, on a real Ubuntu runner, are the actual compile
# check for the chat-memory bot. (The runtime image itself is built and
# deployed via `image/build.sh` on PHATT-RAID, not by this workflow — see
# #3173 and #3428 for those transcripts.)

on:
  push:
    branches: [main]
    paths:
      - "sexton/**"
      - "teamspeak-plugin/**"
      - "image/**"
      - "personas/**"
      - "ts-summoner/**"
      - "whisper/**"
      - ".github/workflows/sexton.yml"
  pull_request:
    branches: [main]
    paths:
      - "sexton/**"
      - "teamspeak-plugin/**"
      - "image/**"
      - "personas/**"
      - "ts-summoner/**"
      - "whisper/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sexton
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sexton/target
          key: ${{ runner.os }}-sexton-cargo-${{ hashFiles('sexton/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sexton-cargo-

      - name: cargo build
        run: cargo build --release

      # The unit tests are the only thing that ever checks the notice text and
      # the welcomed-list round trip (#3305), and they never ran here.
      - name: cargo test
        run: cargo test --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sexton-binaries
          path: |
            sexton/target/release/sexton
            sexton/target/release/send-test
            sexton/target/release/probe-channels
          if-no-files-found: error
          retention-days: 14

  docker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # #3342: sexton now has a workspace path dependency on
      # `bridge-proto` (`../bridge-proto`), whose Cargo.toml inherits
      # `edition`/`license`/`publish` from the repo-root workspace
      # Cargo.toml — both have to be inside the build context. Matches
      # `sexton/deploy/sexton-compose.yml`'s `build:` context/dockerfile
      # split.
      - name: Build image
        run: docker build -t phattbeats/sexton:ci -f sexton/Dockerfile .

      # #3798: this image now defaults to the env->argv wrapper
      # (`sexton/docker-entrypoint.sh`), not the `sexton` binary directly —
      # a BYO deploy with no TS_BRIDGE_CHANNEL set should fail loudly at
      # startup, not launch `sexton` with an empty --channel and let
      # tsclientlib fail confusingly later.
      - name: Verify the env->argv wrapper fails closed with no channel set
        run: |
          set +e
          out=$(docker run --rm phattbeats/sexton:ci 2>&1)
          status=$?
          set -e
          echo "$out"
          [ "$status" -ne 0 ] || { echo "expected a non-zero exit with no TS_BRIDGE_CHANNEL"; exit 1; }
          echo "$out" | grep -q "TS_BRIDGE_CHANNEL is required"

      - name: Verify probe-channels/send-test still reachable via --entrypoint
        run: |
          docker run --rm --entrypoint probe-channels phattbeats/sexton:ci --help >/dev/null
          docker run --rm --entrypoint send-test phattbeats/sexton:ci --help >/dev/null

  publish-ts-bridge:
    # #3798: the standalone bridge half, published for a bring-your-own-
    # OpenClaw attach (someone else's gateway, this container is just the
    # TeamSpeak client). Separate from `combined-image` below, which is the
    # all-in-one Sexton/Bexton deploy and is not meant for a stranger's box.
    # Only runs on main (not PRs — forked PRs don't get GITHUB_TOKEN package
    # write, and there's no reason to publish a tag per PR push here).
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sexton/Dockerfile
          push: true
          tags: |
            ghcr.io/phattbeats/plnt-ts-bridge:latest
            ghcr.io/phattbeats/plnt-ts-bridge:${{ github.sha }}

  combined-image:
    # #3580: the `docker` job above only ever compile-checked the old
    # standalone sexton/Dockerfile — it never covered image/Dockerfile, the
    # one-container image (#3428) that is actually deployed, and that is
    # what this PR changes (the plugin-builder stage now COPYs
    # teamspeak-plugin/ from this repo instead of a build.sh-staged copy of
    # a separate one). PHATT-RAID is the normal build host, and per
    # image/README.md it runs at ~90%+ disk usage most of the time, so this
    # job exists to give that specific change real CI coverage that doesn't
    # depend on the box having headroom on any given day.
    runs-on: ubuntu-24.04
    # #3791: + the suno-api stage (npm install, next build, chromium).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Multi-stage build here pulls the rust, whisper-src, model-fetch,
      # pot-builder and openclaw base images on top of whatever the runner
      # already carries. Reclaim the preinstalled toolchains this job does
      # not use rather than risk ENOSPC mid-build.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # WITH_POT=0: music still works without the POT token; the
      # bgutil-ytdlp-pot-provider clone/npm-install is the slowest optional
      # stage and buys nothing for this check.
      #
      # #3822: never export the full image. `docker build -t` (load into
      # the daemon) stalled on "exporting layers" for 11+ min on the hosted
      # runner and got killed, on main too. Instead append a tiny scratch
      # stage that COPYs only the plugin files out of the `runtime` stage and
      # export just that to a local dir. BuildKit still has to build every
      # stage `runtime` depends on, so the whole Dockerfile is proven to
      # build; only the multi-GB layer export is skipped.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image/Dockerfile (runtime stage, plugin files only)
        run: |
          cat image/Dockerfile - > "$RUNNER_TEMP/ci.Dockerfile" <<'DOCKERFILE'

          FROM scratch AS ci-plugin-check
          COPY --from=runtime /opt/openclaw-teamspeak-plugin/openclaw.plugin.json /plugin/
          COPY --from=runtime /opt/openclaw-teamspeak-plugin/index.ts /plugin/
          COPY --from=runtime /opt/openclaw-teamspeak-plugin/node_modules/ws/package.json /plugin/node_modules/ws/
          DOCKERFILE
          docker buildx build \
            -f "$RUNNER_TEMP/ci.Dockerfile" \
            --build-arg WITH_POT=0 \
            --target ci-plugin-check \
            --output "type=local,dest=$RUNNER_TEMP/plugin-out" \
            .

      - name: Verify the plugin actually landed in the image
        run: |
          set -e
          cd "$RUNNER_TEMP/plugin-out/plugin"
          test -f openclaw.plugin.json
          test -f index.ts
          test -f node_modules/ws/package.json
          echo ok

  stack:
    # #3791: the one-container wiring (image/universal/stack.mjs), the
    # summoner it now runs next to, and the whisper pool's coalescing proxy.
    # Plain node:test, no deps.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test
        run: node --test image/universal/*.test.mjs ts-summoner/test/*.test.mjs whisper/*.test.mjs

  plugin:
    # #3580: folded in from openclaw-teamspeak-plugin's own `test` workflow
    # now that the plugin lives in this repo at teamspeak-plugin/ instead of
    # a separate repo. Runs the plugin's standalone suite: the mock bridge
    # replays recorded frames, so no TeamSpeak server is needed. The live
    # provider path and the SDK-dependent files (src/channel.ts,
    # src/accounts.ts, src/bridge/ws-socket.ts) are excluded here and need a
    # real gateway.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teamspeak-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm install --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # #3798: dist/ is committed (npm:/npm-pack:/git: installs need a
      # compiled openclaw.extensions counterpart present at install time —
      # see package-entry-resolution.ts / plugin-peer-link.ts upstream, and
      # scripts/build.mjs's header comment for why this is a plain rebuild
      # rather than a prepack/prepare lifecycle hook). A PR that changes
      # src/ without regenerating dist/ would otherwise ship a stale
      # compiled plugin to every non---link install silently.
      - name: Build and check dist/ is committed
        run: |
          npm run build
          # #3806: `git diff` alone never reports untracked files, so a PR
          # that added a new src/*.ts file and forgot to `git add` its dist/
          # counterpart passed this check while shipping an incomplete dist/
          # (missing stt-provider.js/stt-registry.js, #3790). Stage first so
          # new files show up too.
          git add -A -- dist
          git diff --cached --exit-code -- dist \
            || { echo "::error::dist/ is stale — run 'npm run build' in teamspeak-plugin/ and commit the result"; exit 1; }
