# Append this service to the TS6 host's compose file (same file/network as
# `teamspeak6-server`, per PHA-3172 finding #5 — do not run this on
# PHATT-RAID with network_mode: host, it will hairpin and get flood-scored).
#
# TS_IDENTITY is generated on first boot if unset (see the container logs
# for the exported identity string) — capture it once and pin it here so the
# bridge keeps the same TS identity across restarts, then have Brandon
# assign the Sexton server group to it in the TS6 client (server-group
# assignment for this bot's identity is tracked as part of PHA-3173's
# closing checklist, not PHA-3172, which is already closed).

services:
  ts-bridge:
    image: phattbeats/ts-bridge:latest
    build: ./ts-bridge
    container_name: ts-bridge
    restart: unless-stopped
    networks:
      - phattvip
    environment:
      TS_SERVER_ADDRESS: teamspeak6-server:9987
      TS_NICKNAME: Sexton-Bridge
      TS_CHANNEL: "" # numeric channel id or exact name; empty = stay in the server's default channel
      TS_IDENTITY: "" # paste the identity string logged on first boot once you have it
      WS_BIND: 0.0.0.0:9099
      DUCK_GAIN: "0.25"
      RUST_LOG: info
      # TTS_WEBHOOK_URL: "" # optional say_text fallback hook — not wired up yet, see README

networks:
  phattvip:
    external: true
