[package]
name = "ts-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/phattbeats/plnt-sexton"
description = "PHA-3341: audio sidecar for the Sexton — per-speaker PCM out, mixed PCM in, music lane with ducking. No longer owns its own tsclientlib connection (the Sexton does); consumes the shared connection over a Unix-domain socket on a Docker-shared volume."

[[bin]]
name = "ts-bridge"
path = "src/main.rs"

[[bin]]
name = "bridge-test"
path = "src/bin/bridge-test.rs"

[dependencies]
# PHA-3341: the bridge no longer talks tsclientlib directly — that crate is
# gone from this dependency list. The Sexton owns the Connection; the bridge
# receives `BridgeEvent`s and sends `BridgeCommand`s through
# `bridge-proto::BridgeClient`. What the bridge still does need from the
# codec side is the audio opacities (`samples_to_pcm16`, opus encoders), so
# `audiopus` stays.
bridge-proto = { path = "../bridge-proto" }

audiopus = "0.3.0-rc.0"
base64 = "0.22"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
rand = "0.8"